name: Nuclei - Vulnerability Scan

on:
  push:
    branches: [ "development", "main" ]
  workflow_dispatch: {}  # Permite correrlo manualmente desde Actions

permissions:
  contents: read
  issues: write   # Para crear Issues si se encuentran vulnerabilidades

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona el repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Ejecuta el escaneo con Nuclei
      - name: Run Nuclei vulnerability scan
        uses: projectdiscovery/nuclei-action@main
        with:
          target: http://${{ secrets.EC2_HOST }}   # Tu app desplegada
          github-report: true                     # Reporta los hallazgos como Issues
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ Guarda el log del escaneo
      - name: Upload Nuclei report
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-scan-report
          path: nuclei.log
