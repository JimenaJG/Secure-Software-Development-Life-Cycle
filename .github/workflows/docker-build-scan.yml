name: Docker Build, Scan and Push

on:
  push:
    branches: [main, development, feature/add-docker-security-pipeline]
  pull_request:
    branches: [main, development]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login en Docker Hub
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Generar versión
      - name: Generar versión
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION=$(cat package.json | jq -r .version)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            SHORT_SHA="${{ github.sha }}"
            echo "version=dev-${SHORT_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      # 5. Construir la imagen Docker
      - name: Build imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Determinar política de escaneo
      - name: Determinar política de escaneo
        id: scan_policy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
            echo "fail_build=true" >> $GITHUB_OUTPUT
            echo "policy=strict" >> $GITHUB_OUTPUT
          else
            echo "exit_code=0" >> $GITHUB_OUTPUT
            echo "fail_build=false" >> $GITHUB_OUTPUT
            echo "policy=permissive" >> $GITHUB_OUTPUT
          fi

      # 7. Escaneo con Trivy
      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: ${{ steps.scan_policy.outputs.exit_code }}
          ignore-unfixed: true

      # 8. Subir resultados de Trivy
      - name: Subir resultados de Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

      # 9. Escaneo con Anchore Grype
      - name: Escanear con Anchore Grype
        uses: anchore/scan-action@v3
        id: scan
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
          fail-build: ${{ steps.scan_policy.outputs.fail_build }}
          severity-cutoff: high
          output-format: sarif

      # 10. Subir resultados de Anchore
      - name: Subir resultados de Anchore a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: "grype"

      # 11a. Push imagen (development/feature branches)
      - name: Push imagen a Docker Hub (development)
        uses: docker/build-push-action@v5
        if: success() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:development
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 11b. Push imagen (main/production)
      - name: Push imagen a Docker Hub (production)
        uses: docker/build-push-action@v5
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 12. Generar reporte de resumen
      - name: Generar reporte de resumen
        if: always()
        run: |
          echo "## 🐳 Docker Build & Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Image Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** \`${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy:** ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Anchore Grype:** ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy:** \`${{ steps.scan_policy.outputs.policy }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Details:** Security → Code scanning alerts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ℹ️ Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.version.outputs.is_main }}" == "true" ]]; then
            echo "🚀 **Production build** - Strict security policy applied" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔧 **Development build** - Permissive security policy" >> $GITHUB_STEP_SUMMARY
          fi