name: Docker Build, Scan and Push

on:
  push:
    branches: [main, development, feature/add-docker-security-pipeline]
  pull_request:
    branches: [main, development]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Docker Buildx (herramienta para builds eficientes)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login en Docker Hub
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Generar versión semántica
      - name: Generar versión
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION=$(cat package.json | jq -r .version)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            VERSION="${{ github.sha }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      # 5. Construir la imagen Docker (sin hacer push todavía)
      - name: Build imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Determinar política de escaneo
      - name: Determinar política de escaneo
        id: scan_policy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
            echo "policy=strict" >> $GITHUB_OUTPUT
          else
            echo "exit_code=0" >> $GITHUB_OUTPUT
            echo "policy=permissive" >> $GITHUB_OUTPUT
          fi

      # 7. Escaneo de vulnerabilidades con Trivy
      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: ${{ steps.scan_policy.outputs.exit_code }}

      # 6. Subir resultados del escaneo a GitHub Security
      - name: Subir resultados de Trivy a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      # 8. Escaneo adicional con Anchore Grype (segunda opinión)
      - name: Escanear con Anchore Grype
        uses: anchore/scan-action@v3
        id: scan
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
          fail-build: ${{ steps.version.outputs.is_main }}
          severity-cutoff: high
          output-format: sarif

      # 8. Subir resultados de Anchore
      - name: Subir resultados de Anchore a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      # 9. Push de la imagen a Docker Hub (solo si todo fue exitoso)
      - name: Push imagen a Docker Hub
        uses: docker/build-push-action@v5
        if: success()
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una:${{ github.ref == 'refs/heads/main' && 'latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 10. Generar reporte de resumen
      - name: Generar reporte de resumen
        if: always()
        run: |
          echo "## Docker Build and Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** \`${{ secrets.DOCKERHUB_USERNAME }}/okta-oidc-una\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy:** Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Anchore Grype:** Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy:** \`${{ steps.scan_policy.outputs.policy }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Details:** Security → Code scanning alerts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
